<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CupSir Macro Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css">
  <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
</head>
<body>
  <header class="header">
    <div><h1>CupSir Macro Dashboard</h1><p id="updatedAt">Loading...</p></div>
    <div id="overallSignal" class="signal warning">Loading</div>
  </header>
  <main>
    <section class="top-grid">
      <article class="panel"><h2>未來兩周經濟事件</h2><div id="events"></div></article>
      <article class="panel"><h2>市場新聞與重要講話</h2><div id="news"></div></article>
    </section>
    <div class="tabs">
      <button class="tab active" data-tab="market">整體市場</button>
      <button class="tab" data-tab="sectors">板塊</button>
    </div>
    <div id="marketTab" class="tab-panel">
      <section id="breadthCards" class="breadth-cards"></section>
      <section class="indicator-layout">
        <aside class="panel"><h2>指標</h2><div id="indicatorList"></div></aside>
        <article class="panel"><div id="indicatorDetail"><p>正在讀取指標資料。</p></div></article>
      </section>
    </div>
    <div id="sectorsTab" class="tab-panel" hidden>
      <section class="panel breadth-table-panel">
        <div id="sectorTable"></div>
        <div id="sectorDetail"></div>
      </section>
    </div>
    <section class="panel"><h2>AI / 規則式研究摘要</h2><div id="summary"></div></section>
  </main>
  <script src="app.js"></script>
  <script src="breadth.js"></script>
</body>
</html>
