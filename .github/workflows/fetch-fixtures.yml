name: Fetch test fixtures

# Downloads the historical bars listed in tests/pipeline/fixtures/request.json
# and commits them as CSV fixtures for the fixed tests. Not part of the daily
# data refresh: it runs only by hand, or when request.json changes on a
# branch other than main.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - tests/pipeline/fixtures/request.json

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download fixtures
        run: python tests/pipeline/fetch_fixtures.py
      - name: Commit fixtures
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/pipeline/fixtures/
          git diff --cached --quiet || git commit -m "test: refresh pipeline fixtures"
          git push
