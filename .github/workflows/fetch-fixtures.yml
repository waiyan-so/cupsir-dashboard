name: Fetch test fixtures

# Downloads the historical bars and the CFTC sample listed in
# tests/pipeline/fixtures/request.json and commits them as fixtures for the
# fixed tests. Not part of the daily data refresh: it runs only by hand
# (Actions tab -> this workflow -> Run workflow, on the branch that needs them).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download fixtures
        run: python tests/pipeline/fetch_fixtures.py
      - name: Commit fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/pipeline/fixtures/
          git diff --cached --quiet || git commit -m "test: refresh pipeline fixtures"
          git push
