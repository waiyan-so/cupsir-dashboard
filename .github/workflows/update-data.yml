name: Update CupSir dashboard data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 1-5"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate forward economic calendar
        run: python scripts/fetch_events.py
      - name: Fetch market news and speeches
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python scripts/fetch_news.py
      - name: Build dashboard data and signals
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/build_dashboard.py
          python scripts/generate_summary.py
      - name: Build market breadth and sector data
        continue-on-error: true
        run: python scripts/run_pipeline.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: refresh dashboard data"
          git push
